name: Sarvam AI
kind: company
description: Sarvam AI is India's full-stack sovereign AI platform building large language
  models, speech, and translation systems for Indian languages. The Sarvam API serves
  chat completions (Sarvam-M / Sarvam-30B / Sarvam-105B), speech-to-text (Saaras /
  Saarika), text-to-speech (Bulbul), translation (Mayura / Sarvam-Translate),
  transliteration, and language identification across 10-22 Indic languages via a
  REST interface using an api-subscription-key header.
