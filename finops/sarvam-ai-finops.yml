description: >-
  FinOps view of Sarvam AI spend. Sarvam bills usage-based per-token rates for
  chat LLM (separate input, cached-input, and output meters per model),
  per-hour rates for speech-to-text and speech-to-text-translate, and
  per-10,000-character rates for text-to-speech, translation, transliteration,
  and language identification. Published rates are in Indian Rupees (INR);
  accounts start with free credits.
notes: >-
  Per-model and per-product rates are subject to change and are published in
  INR; verify against the Sarvam AI pricing pages during reconciliation.
sources:
- https://www.sarvam.ai/api-pricing
- https://docs.sarvam.ai/api-reference-docs/pricing
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Sarvam AI
serviceCategory: AI and Machine Learning
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: INR
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Sarvam AI API
  ServiceCategory: AI and Machine Learning
  ProviderName: Sarvam AI
  PublisherName: Sarvam AI
  InvoiceIssuerName: Sarvam AI
  BillingCurrency: INR
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: input_tokens
  description: Tokens sent in chat completion requests, billed per 1M tokens per model.
  unit: tokens
  aggregation: sum
  dimensions:
  - account
  - model
  - api
- name: cached_input_tokens
  description: Cached-input tokens billed at the discounted cached-input rate per model.
  unit: tokens
  aggregation: sum
  dimensions:
  - account
  - model
- name: output_tokens
  description: Tokens generated, billed per 1M tokens per model.
  unit: tokens
  aggregation: sum
  dimensions:
  - account
  - model
  - api
- name: stt_audio_hours
  description: Audio hours transcribed via speech-to-text and speech-to-text-translate, billed per hour.
  unit: hours
  aggregation: sum
  dimensions:
  - account
  - model
- name: tts_characters
  description: Text-to-speech characters synthesized, billed per 10,000 characters per Bulbul model.
  unit: characters
  aggregation: sum
  dimensions:
  - account
  - model
- name: translate_characters
  description: Translation and transliteration characters, billed per 10,000 characters.
  unit: characters
  aggregation: sum
  dimensions:
  - account
  - model
- name: language_id_characters
  description: Language identification characters, billed per 10,000 characters.
  unit: characters
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Pull Sarvam AI usage and credit-burn exports from the dashboard; inspect per-product and per-model spend.
- name: Allocation
  description: Tag API keys per workload/team; map to internal cost centers (keys share an account rate pool).
- name: Optimization
  description: Choose Sarvam-30B over Sarvam-105B when sufficient; enable cached input; cap text length for TTS/translate; pick the lighter STT model where diarization is not needed.
- name: Accountability
  description: Assign owners per project/key; review INR credit spend monthly against budget and convert to reporting currency.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
